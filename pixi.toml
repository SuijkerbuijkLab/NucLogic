[workspace]
name = "NucLogic"
version = "0.2.0"
description = "NucLogic organoid segmentation desktop app"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

# ── Conda dependencies ────────────────────────────────────────────────────────
[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pandas = "*"
tifffile = "*"
scikit-learn = "*"
scikit-image = "*"
pyside6 = "*"
pytables = "*"   # replaces PyPI 'tables' — bundles HDF5, avoids Windows link issues

# ── PyPI dependencies ─────────────────────────────────────────────────────────
[pypi-dependencies]
torch = ">=2.5.1"
torchvision = ">=0.20.1"
torchaudio = "*"
napari = { version = "*", extras = ["pyside6"] }
napari-animation = "*"
napari-plugin-manager = "*"
imaris-ims-file-reader = "*"
hdf5plugin = "*"
alive-progress = "*"
libpysal = "*"
esda = "*"
matplotlib = "*"
seaborn = "*"
pyqtdarktheme = "*"
opencv-python = "*"
PyImarisWriter = "*"
cellpose = "*"
"SAM-2" = { git = "https://github.com/facebookresearch/sam2.git" }
nd2 = "*"
bioio = "*"
bioio-czi = "*"
bioio-lif = "*"

# ── PyPI index configuration ──────────────────────────────────────────────────
# PyTorch index listed first so uv prefers CUDA wheels over CPU-only PyPI builds
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"

# ── Runtime environment variables ─────────────────────────────────────────────
[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"   # suppress OpenMP conflict between numpy and torch
PYTHONIOENCODING = "utf-8"
PYTHONUTF8 = "1"

# ── Tasks ─────────────────────────────────────────────────────────────────────
[tasks]
start = "python PySide6/launcher.py"
