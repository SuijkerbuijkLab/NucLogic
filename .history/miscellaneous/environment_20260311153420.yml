name: NucLogic
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11

  # Scientific stack
  - numpy
  - scipy
  - pandas
  - tifffile
  - scikit-learn
  - scikit-image

  # UI framework
  - pyside2

  # Napari with PySide2 backend
  - pip
  - pip:
      - torch==2.10.0+cu128 torchvision==0.20.0+cu128 --index-url https://download.pytorch.org/whl/cu128
      - "napari[pyside2]"
      - cellpose
      - imaris-ims-file-reader
      - alive-progress
      - libpysal
      - esda
      - matplotlib
      - seaborn
      - tables
      - qdarktheme
      - opencv-python-headless
      - PyImarisWriter