name: organoid_segmenter
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # GPU stack (CUDA 11.8)
  - pytorch
  - torchvision
  - pytorch-cuda=11.8

  # Scientific stack
  - scipy
  - pandas
  - tifffile

  # UI framework
  - pyside2

  # Napari with PySide2 backend
  - pip
  - pip:
      - "napari[pyside2]"
      - cellpose
      - imaris-ims-file-reader
      - alive-progress
